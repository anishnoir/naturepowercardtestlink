<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f3efe4" />
  <title>Nature Power Card</title>
  <style>
    :root {
      --paper: #f3efe4;
      --paper-deep: #e7e0d0;
      --ink: #20302b;
      --muted: #66716b;
      --line: rgba(32, 48, 43, 0.15);
      --forest: #23483d;
      --forest-dark: #17332c;
      --moss: #759077;
      --sun: #d97745;
      --sun-dark: #aa4f2f;
      --white: #fffdf8;
      --shadow: 0 16px 35px rgba(44, 54, 47, 0.11), 0 2px 4px rgba(44, 54, 47, 0.08);
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(rgba(35, 72, 61, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(35, 72, 61, 0.025) 1px, transparent 1px),
        var(--paper);
      background-size: 24px 24px;
      font-family: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; }

    .shell {
      width: min(1160px, calc(100% - 40px));
      margin: 0 auto;
      padding: 44px 0 64px;
    }

    .masthead {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      padding-bottom: 26px;
      border-bottom: 1px solid var(--line);
    }

    .kicker {
      margin: 0 0 11px;
      color: var(--sun-dark);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1, h2, p { margin-top: 0; }

    h1 {
      margin-bottom: 10px;
      color: var(--forest-dark);
      font-family: Georgia, "Songti SC", "STSong", serif;
      font-size: clamp(2rem, 4vw, 3.45rem);
      font-weight: 500;
      letter-spacing: 0.01em;
      line-height: 1.05;
    }

    .subtitle {
      max-width: 560px;
      margin-bottom: 0;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.7;
    }

    .mark {
      display: grid;
      flex: 0 0 auto;
      width: 68px;
      height: 68px;
      place-items: center;
      border: 1px solid rgba(35, 72, 61, 0.33);
      border-radius: 50%;
      color: var(--forest);
      font-family: Georgia, serif;
      font-size: 1.4rem;
      letter-spacing: -0.08em;
      transform: rotate(-8deg);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 28px 0 20px;
    }

    .section-label {
      margin: 0;
      color: var(--forest-dark);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .counter {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .counter strong {
      color: var(--sun-dark);
      font-family: Georgia, serif;
      font-size: 1.35rem;
      font-weight: 500;
    }

    .deck {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      max-width: 1040px;
      margin: 0 auto;
      justify-content: center;
      gap: clamp(10px, 1.4vw, 16px);
      perspective: 1200px;
    }

    @media (min-width: 761px) {
      .deck .card:nth-child(17) { grid-column: 3; }
    }

    .card {
      position: relative;
      aspect-ratio: 2 / 3;
      min-height: 0;
      padding: 0;
      border: 0;
      border-radius: 7px;
      color: var(--white);
      background: transparent;
      cursor: pointer;
      transition: transform 180ms ease, filter 180ms ease;
    }

    .card:hover { transform: translateY(-4px); filter: saturate(1.08); }

    .card:focus-visible {
      outline: 3px solid rgba(217, 119, 69, 0.62);
      outline-offset: 4px;
    }

    .card.is-selected { transform: translateY(-7px); }

    .card-inner {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      padding: clamp(15px, 2vw, 22px);
      border: 1px solid rgba(255, 253, 248, 0.22);
      border-radius: 7px;
      background:
        radial-gradient(circle at 20% 18%, rgba(255,255,255,0.15) 0 1px, transparent 1.5px),
        radial-gradient(circle at 72% 78%, rgba(255,255,255,0.09) 0 1px, transparent 1.5px),
        var(--forest);
      background-size: 19px 19px, 27px 27px, auto;
      box-shadow: var(--shadow);
      transition: border-color 180ms ease, box-shadow 180ms ease, background-color 180ms ease;
    }

    .card-inner::before,
    .card-inner::after {
      position: absolute;
      content: "";
      pointer-events: none;
    }

    .card-inner::before {
      inset: 9px;
      border: 1px solid rgba(255, 253, 248, 0.24);
      border-radius: 4px;
    }

    .card-inner::after {
      right: -25%;
      bottom: 12%;
      width: 75%;
      height: 1px;
      background: rgba(255, 253, 248, 0.24);
      box-shadow: 0 12px 0 rgba(255, 253, 248, 0.17), 0 -12px 0 rgba(255, 253, 248, 0.17);
      transform: rotate(-38deg);
    }

    .card.is-selected .card-inner {
      border-color: #f0a178;
      box-shadow: 0 0 0 3px rgba(217, 119, 69, 0.72), 0 16px 35px rgba(44, 54, 47, 0.16);
      background-color: #2e5b4d;
    }

    .card-number {
      position: relative;
      z-index: 1;
      color: rgba(255, 253, 248, 0.7);
      font-family: Georgia, serif;
      font-size: 0.84rem;
      letter-spacing: 0.13em;
    }

    .back-symbol {
      position: relative;
      z-index: 1;
      align-self: center;
      color: rgba(255, 253, 248, 0.93);
      font-family: Georgia, serif;
      font-size: clamp(2.8rem, 7vw, 5.2rem);
      font-weight: 400;
      line-height: 1;
      transform: rotate(-8deg);
    }

    .back-caption {
      position: relative;
      z-index: 1;
      align-self: flex-end;
      color: rgba(255, 253, 248, 0.68);
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.19em;
      text-transform: uppercase;
    }

    .selection-dot {
      position: absolute;
      z-index: 2;
      top: 17px;
      right: 17px;
      display: grid;
      width: 21px;
      height: 21px;
      place-items: center;
      border: 1px solid rgba(255, 253, 248, 0.65);
      border-radius: 50%;
      color: transparent;
      font-size: 0.77rem;
      font-weight: 800;
    }

    .card.is-selected .selection-dot {
      border-color: #f0a178;
      color: #fff9ef;
      background: var(--sun);
    }

    .action-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-top: 28px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
    }

    .microcopy {
      margin: 0;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 45px;
      padding: 0 18px;
      border: 1px solid transparent;
      border-radius: 4px;
      font-size: 0.88rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: background-color 160ms ease, border-color 160ms ease, color 160ms ease, transform 160ms ease;
    }

    .button:focus-visible {
      outline: 3px solid rgba(217, 119, 69, 0.46);
      outline-offset: 3px;
    }

    .button-primary {
      color: #fff9ef;
      background: var(--sun);
      box-shadow: 0 7px 14px rgba(170, 79, 47, 0.16);
    }

    .button-primary:hover:not(:disabled) { background: var(--sun-dark); transform: translateY(-1px); }
    .button-primary:disabled { opacity: 0.42; cursor: not-allowed; box-shadow: none; }

    .button-quiet {
      color: var(--forest);
      border-color: rgba(35, 72, 61, 0.25);
      background: transparent;
    }

    .button-quiet:hover { border-color: var(--forest); background: rgba(35, 72, 61, 0.06); }

    .results[hidden] { display: none; }

    .results {
      animation: rise 420ms ease both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(13px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin: 32px 0 20px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    .result-heading h2 {
      margin-bottom: 0;
      color: var(--forest-dark);
      font-family: Georgia, "Songti SC", "STSong", serif;
      font-size: clamp(1.75rem, 3vw, 2.45rem);
      font-weight: 500;
    }

    .draw-meta {
      margin: 0;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.5;
      text-align: right;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
    }

    .result-card {
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 21px;
      border: 1px solid rgba(35, 72, 61, 0.4);
      border-radius: 7px;
      background: var(--white);
      box-shadow: var(--shadow);
    }

    .result-card::before {
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(35, 72, 61, 0.16);
      border-radius: 4px;
      content: "";
      pointer-events: none;
    }

    .result-head {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
    }

    .result-index {
      color: var(--sun-dark);
      font-family: Georgia, serif;
      font-size: 0.92rem;
      letter-spacing: 0.12em;
    }

    .result-label {
      font-size: 0.6rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .result-art {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 2 / 3;
      object-fit: contain;
      margin: 16px 0;
    }

    .result-name {
      position: relative;
      z-index: 1;
      margin: 0 0 6px;
      color: var(--forest-dark);
      font-family: Georgia, "Songti SC", "STSong", serif;
      font-size: 1.45rem;
      font-weight: 500;
      line-height: 1.15;
    }

    .result-name span {
      margin-left: 7px;
      color: var(--muted);
      font-family: "Avenir Next", "PingFang SC", sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .keywords {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 0 0 13px;
    }

    .keyword {
      padding: 4px 8px;
      border-radius: 999px;
      color: var(--forest);
      background: rgba(117, 144, 119, 0.15);
      font-size: 0.71rem;
      line-height: 1.2;
    }

    .core {
      position: relative;
      z-index: 1;
      margin: 0;
      color: var(--ink);
      font-size: 0.9rem;
      line-height: 1.7;
    }

    .core strong { color: var(--sun-dark); }

    .distinction {
      position: relative;
      z-index: 1;
      margin: 11px 0 0;
      padding-top: 11px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.65;
    }

    .distinction strong {
      display: block;
      margin-bottom: 6px;
      color: var(--sun-dark);
    }

    .distinction p {
      margin: 0 0 6px;
    }

    .distinction p:last-child { margin-bottom: 0; }

    .result-actions {
      display: flex;
      justify-content: center;
      margin-top: 26px;
    }

    .status-live {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 760px) {
      .shell { width: min(100% - 28px, 580px); padding-top: 28px; }
      .masthead { padding-bottom: 21px; }
      .mark { width: 54px; height: 54px; font-size: 1.08rem; }
      .subtitle { font-size: 0.9rem; }
      .deck { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
      .card { min-height: 0; }
      .card-inner { padding: 12px; }
      .card-inner::before { inset: 6px; }
      .selection-dot { top: 11px; right: 11px; width: 18px; height: 18px; font-size: 0.68rem; }
      .card-number { font-size: 0.7rem; }
      .back-caption { font-size: 0.5rem; }
      .action-row { align-items: stretch; flex-direction: column; }
      .button-primary { width: 100%; }
      .result-heading { align-items: flex-start; flex-direction: column; }
      .draw-meta { text-align: left; }
      .result-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .result-card { padding: 16px; }
      .result-name { font-size: 1.22rem; }
      .result-art { margin: 12px 0; }
    }

    @media (max-width: 460px) {
      .result-grid { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div>
        <p class="kicker">Nature Power Card · Test Draw</p>
        <h1>自然之力，正在牌面之外。</h1>
        <p class="subtitle">从 20 张盖上的牌中选出此刻想要的几张。</p>
      </div>
      <div class="mark" aria-hidden="true">N/P</div>
    </header>

    <section id="selection-view" aria-labelledby="selection-title">
      <div class="toolbar">
        <h2 class="section-label" id="selection-title">选择牌面</h2>
        <p class="counter" aria-live="polite"><strong id="selected-count">0</strong><span>/ 20 已选</span></p>
      </div>

      <div class="deck" id="deck" role="group" aria-label="20 张盖上的牌"></div>

      <div class="action-row">
        <p class="microcopy" id="selection-state">等待选择</p>
        <button class="button button-primary" id="draw-button" type="button" disabled>
          <span aria-hidden="true">↗</span> 完成抽取
        </button>
      </div>
    </section>

    <section class="results" id="results-view" aria-labelledby="results-title" hidden>
      <div class="result-heading">
        <h2 id="results-title">你的牌面</h2>
        <p class="draw-meta" id="draw-meta"></p>
      </div>
      <div class="result-grid" id="result-grid"></div>
      <div class="result-actions">
        <button class="button button-quiet" id="restart-button" type="button"><span aria-hidden="true">↺</span> 重新选择</button>
      </div>
    </section>

    <p class="status-live" id="status-live" aria-live="polite"></p>
  </main>

  <script>
    const cards = [
      {
        number: "01", en: "Wild", zh: "野",
        keywords: ["空荡的", "野的", "原始的", "不可定义的", "遥远的过去", "没有链接的", "开放的", "未被驯化的", "尚未形成的"],
        core: "没有被建立、命名或连接起来的状态。",
        distinction: ["vs Forest：Wild 是尚未形成结构；Forest 是多个部分已经形成能够自我维持的系统。", "vs Cave：Wild 是开放但未被建立；Cave 是已经存在，却与外部隔绝。", "vs Oasis：Wild 是环境本身未被驯化；Oasis 是匮乏环境中已经形成的稀缺存在。"]
      },
      {
        number: "02", en: "Thunder", zh: "雷",
        keywords: ["巨大的声音", "突变", "刻骨铭心的", "巨变", "破碎", "破坏", "外部变化", "突然发生的", "无法忽视的"],
        core: "来自外部的巨大冲击，使原有状态突然改变。",
        distinction: ["vs Volcano：Thunder 是外部冲击；Volcano 是内部积累后的爆发。", "vs Fire：Thunder 是已有状态被突然改变；Fire 是一个新事件第一次被点燃。", "vs God Tree：Thunder 是造成破坏的巨大冲击；God Tree 是原有结构最终彻底瓦解的结果。"]
      },
      {
        number: "03", en: "Fire", zh: "火",
        keywords: ["一个事件的开始", "灵感", "独立的", "点燃", "行动的起点", "自发的", "产生动力", "从无到有"],
        core: "某件事情第一次被点燃，并开始产生自己的动力。",
        distinction: ["vs Thunder：Fire 是从无到有的启动；Thunder 是外部冲击造成的突变。", "vs Volcano：Fire 是刚刚产生动力；Volcano 是内部动力长期积累后达到临界。", "vs Blue Hour：Fire 是开始；Blue Hour 是旧状态结束、新状态开始之间的过渡。"]
      },
      {
        number: "04", en: "Forest", zh: "森林",
        keywords: ["丰富的", "中等时间固定的系统", "成套的", "群体的", "分工协作的", "内部轮替的", "完整体系的", "不容易被细小力量摧毁", "容易被巨大力量变革"],
        core: "多个部分形成一个能够自我维持的完整系统。",
        distinction: ["vs Wild：Wild 是尚未形成结构；Forest 是结构已经形成。", "vs Root：Forest 是已经运行的整体系统；Root 是支撑系统存在的底层基础。", "vs God Tree：Forest 是结构能够维持自身；God Tree 是结构已经失去维持能力并彻底崩塌。"]
      },
      {
        number: "05", en: "Glacier", zh: "冰山",
        keywords: ["表面平静但早晚会出现问题", "短暂的平静", "需要条件触发", "暗流涌动", "短时间内不可逆", "潜伏的", "尚未显现的变化"],
        core: "变化已经存在，只是还没有到显现的时候。",
        distinction: ["vs Volcano：Glacier 是变化处于潜伏状态；Volcano 是内部积累已经达到临界。", "vs Blue Hour：Glacier 是变化尚未显现；Blue Hour 是变化已经开始发生。", "vs Moon：Glacier 是客观状态中的潜伏变化；Moon 是内在世界尚未表达的内容。"]
      },
      {
        number: "06", en: "River Fork", zh: "河流支流",
        keywords: ["一分为二的", "能量分开的", "分离的", "细化的", "分手", "分而治之", "选择不同方向的", "路径分叉的"],
        core: "原本共同的东西开始沿不同方向流动。",
        distinction: ["vs Whirlpool：River Fork 是一个整体分成不同方向；Whirlpool 是轨迹被力量改变并向中心卷入。", "vs Swamp：River Fork 是继续运动但方向发生改变；Swamp 是运动本身受到阻滞。", "vs Blue Hour：River Fork 强调方向分化；Blue Hour 强调旧状态向新状态转换。"]
      },
      {
        number: "07", en: "Swamp", zh: "沼泽",
        keywords: ["陷入的", "滞留的", "难以脱身的", "越挣扎越深的", "消耗性的", "黏滞的", "前进困难的", "边界模糊的", "看似可以通过但实际上无法通过的", "长时间停留的", "可以避开的危险", "需要判断与绕行的"],
        core: "不是没有路，而是每一步都很难真正离开原来的位置。",
        distinction: ["vs Cave：Cave 是空间上的封闭与隔绝；Swamp 是行动上的陷入与滞留。", "vs Whirlpool：Swamp 是走进去以后很难出来；Whirlpool 是有力量持续把你往里面拉。", "vs Glacier：Glacier 是表面平静、内部潜伏；Swamp 是已经被环境拖住并持续消耗。", "vs Volcano：Swamp 的危险可以判断、绕行和避开；Volcano 达到临界后无法规避。", "vs Blue Hour：Swamp 是被困在原状态；Blue Hour 是原状态正在自然结束。"]
      },
      {
        number: "08", en: "Tide", zh: "潮汐",
        keywords: ["反复的", "周期性的", "涨落的", "潮起潮落", "不断回来的", "看似重复的", "始终变化的", "无法停止的变化", "规律中的变化", "表面不变但实际上一直在变化"],
        core: "看似不断回到原来的位置，但实际上从未真正停止变化。",
        distinction: ["vs Swamp：Swamp 是真正的停滞；Tide 是看似重复，但变化始终存在。", "vs Whirlpool：Tide 是规律性的涨落与回返；Whirlpool 是持续旋转并产生卷入。", "vs Blue Hour：Tide 是周期性、反复的变化；Blue Hour 是短暂、单向的过渡。", "vs Canyon：Tide 是变化不断循环；Canyon 是变化不断累积并留下不可逆的痕迹。"]

    const deck = document.querySelector("#deck");
    const selectedCount = document.querySelector("#selected-count");
    const selectionState = document.querySelector("#selection-state");
    const drawButton = document.querySelector("#draw-button");
    const selectionView = document.querySelector("#selection-view");
    const resultsView = document.querySelector("#results-view");
    const resultGrid = document.querySelector("#result-grid");
    const drawMeta = document.querySelector("#draw-meta");
    const restartButton = document.querySelector("#restart-button");
    const statusLive = document.querySelector("#status-live");

    const selected = new Set();

    function renderDeck() {
      const order = shuffle(cards.map((_, index) => index));
      deck.innerHTML = order.map((index) => {
        const card = cards[index];
        return `
        <button class="card" type="button" data-index="${index}" aria-pressed="false" aria-label="第 ${card.number} 张盖上的牌">
          <span class="card-inner">
            <span class="selection-dot" aria-hidden="true">✓</span>
            <span class="back-symbol" aria-hidden="true">✳</span>
            <span class="back-caption">nature / power</span>
          </span>
        </button>
      `;
      }).join("");
    }

    function handleCardClick(event) {
      const button = event.target.closest(".card");
      if (!button) return;
      const index = Number(button.dataset.index);
      if (selected.has(index)) {
        selected.delete(index);
      } else {
        selected.add(index);
      }
      button.classList.toggle("is-selected", selected.has(index));
      button.setAttribute("aria-pressed", String(selected.has(index)));
      updateSelectionState();
    }

    function updateSelectionState() {
      const count = selected.size;
      selectedCount.textContent = String(count);
      drawButton.disabled = count === 0;
      selectionState.textContent = count === 0 ? "等待选择" : `${count} 张牌已就位`;
      statusLive.textContent = count === 0 ? "没有选中的牌" : `已选 ${count} 张牌`;
    }

    function shuffle(list) {
      const shuffled = [...list];
      for (let i = shuffled.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function renderResults() {
      const drawn = shuffle([...selected].map((index) => cards[index]));
      resultGrid.innerHTML = drawn.map((card, index) => `
        <article class="result-card">
          <div class="result-head">
            <span class="result-index">${String(index + 1).padStart(2, "0")}</span>
            <span class="result-label">revealed</span>
          </div>
          <img class="result-art" src="assets/cards/${Number(card.number)}.svg" alt="${card.number} ${card.zh} ${card.en} 牌面" width="200" height="300" loading="lazy" decoding="async">
        </article>
      `).join("");

      drawMeta.textContent = `本次抽取 ${drawn.length} 张 · 顺序由 JavaScript 随机生成`;
      selectionView.hidden = true;
      resultsView.hidden = false;
      resultsView.scrollIntoView({ behavior: "smooth", block: "start" });
      statusLive.textContent = `抽取完成，共 ${drawn.length} 张牌`;
    }

    function restart() {
      selected.clear();
      renderDeck();
      resultGrid.innerHTML = "";
      selectionView.hidden = false;
      resultsView.hidden = true;
      updateSelectionState();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    drawButton.addEventListener("click", renderResults);
    restartButton.addEventListener("click", restart);
    deck.addEventListener("click", handleCardClick);
    renderDeck();
    updateSelectionState();
  </script>
